<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Particle Heart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = [];
        const particleCount = 400;

        function heartShape(t) {
            const scale = Math.min(canvas.width, canvas.height) / 33;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return {
                x: x * scale,
                y: y * scale
            };
        }

        let isTouching = false;
        let touchStartTime = 0;
        let touchX = 0;
        let touchY = 0;

        class Particle {
            constructor(t, offset = 0) {
                this.t = t;
                this.offset = offset;
                this.basePos = heartShape(t);
                this.angle = Math.random() * Math.PI * 2;
                this.radius = Math.random() * 8 + 2;
                this.speed = 0.01;
                this.zFrequency = 0.002;
                this.opacity = Math.random() * 0.8 + 0.2;
                this.size = Math.random() * 3 + 1;
                this.z = Math.random() * 100 - 50;
                this.rotationSpeed = (Math.random() - 0.5) * 0.02;
                this.falling = false;
                this.fallSpeed = 0;
                this.fallDirection = Math.random() * Math.PI * 2;
                this.fallDistance = Math.random() * 200 + 100;
                this.fallProgress = 0;
                this.gravity = 0.05;
                this.update();
            }

            update() {
                if (isTouching) {
                    if (!this.falling) {
                        this.falling = true;
                        this.fallStartX = this.x;
                        this.fallStartY = this.y;
                        this.fallDirection = Math.atan2(
                            canvas.height - this.y + Math.random() * 100 - 50,
                            touchX - this.x + Math.random() * 200 - 100
                        );
                        this.fallDistance = Math.random() * 300 + 200;
                    }

                    this.fallProgress += 0.01;
                    const progress = Math.min(this.fallProgress, 1);

                    this.x = this.fallStartX + Math.cos(this.fallDirection) * this.fallDistance * progress;
                    this.y = this.fallStartY + Math.sin(this.fallDirection) * this.fallDistance * progress +
                        this.gravity * progress * progress * 500;

                    this.currentSize = this.size * (1 - progress * 0.5);
                    this.currentOpacity = this.opacity * (1 - progress * 0.7);

                    if (progress >= 1) {
                        this.currentOpacity *= 0.95;
                    }
                } else {
                    this.angle += this.rotationSpeed;
                    this.z += Math.sin(Date.now() * this.zFrequency) * 0.5;

                    const heartPos = heartShape(this.t + this.offset);

                    if (this.z > 50) {
                        this.x += (Math.random() - 0.5) * 10;
                        this.y += (Math.random() - 0.5) * 10;
                        this.opacity -= 0.01;

                        if (this.opacity <= 0) {
                            this.opacity = 0;
                        }
                    } else {
                        this.x = canvas.width / 2 + heartPos.x;
                        this.y = canvas.height / 2 + heartPos.y;
                    }

                    const circleX = Math.cos(this.angle) * this.radius;
                    const circleY = Math.sin(this.angle) * this.radius;
                    const circleZ = Math.sin(this.angle * 2) * this.radius * 0.5;

                    const perspective = 200;
                    const scale = perspective / (perspective + this.z + circleZ);

                    this.x = canvas.width / 2 + (heartPos.x + circleX) * scale;
                    this.y = canvas.height / 2 + (heartPos.y + circleY) * scale;
                    this.currentSize = this.size * scale;
                    this.currentOpacity = this.opacity * scale * 0.8;

                    this.offset += this.speed;
                }
            }

            draw() {
                if (this.currentOpacity <= 0) return;

                ctx.save();

                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.currentSize * 3
                );
                gradient.addColorStop(0, `rgba(135, 206, 250, ${this.currentOpacity})`);
                gradient.addColorStop(0.5, `rgba(173, 216, 230, ${this.currentOpacity * 0.7})`);
                gradient.addColorStop(1, `rgba(135, 206, 250, 0)`);

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.currentSize * 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = `rgba(135, 206, 250, ${this.currentOpacity * 0.9})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.currentSize, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        function initParticles() {
            particles.length = 0;
            const step = (Math.PI * 2) / particleCount;

            for (let i = 0; i < particleCount; i++) {
                const t = i * step;
                if (i % 2 === 0) particles.push(new Particle(t, 0));
                if (i % 5 === 0) particles.push(new Particle(t, Math.PI / 4));
                if (i % 7 === 0) particles.push(new Particle(t, -Math.PI / 4));
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            initParticles();
        });

        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                resizeCanvas();
                initParticles();
            }, 100);
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isTouching = true;
            touchStartTime = Date.now();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            touchX = touch.clientX - rect.left;
            touchY = touch.clientY - rect.top;
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            isTouching = false;
            setTimeout(() => {
                initParticles();
            }, 2000);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isTouching) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            particles.forEach(particle => {
                if (!particle.basePos || particle.falling) return;
                const dx = mouseX - particle.x;
                const dy = mouseY - particle.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 100) {
                    const force = (100 - distance) / 100;
                    particle.x -= (dx / distance) * force * 2;
                    particle.y -= (dy / distance) * force * 2;
                }
            });
        });

        canvas.addEventListener('mousedown', (e) => {
            isTouching = true;
            touchStartTime = Date.now();
            const rect = canvas.getBoundingClientRect();
            touchX = e.clientX - rect.left;
            touchY = e.clientY - rect.top;
        });

        canvas.addEventListener('mouseup', (e) => {
            isTouching = false;
            setTimeout(() => {
                initParticles();
            }, 2000);
        });

        initParticles();
        animate();
    </script>
</body>

</html>
