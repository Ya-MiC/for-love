<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Particle Heart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: radial-gradient(ellipse at center, #0a0a0f 0%, #000000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- CUSTOMIZE CANVAS SIZE HERE --- */
        canvas {
            display: block;
            /* Examples:
                width: 800px; height: 600px;  (Fixed size)
                width: 80vw; height: 80vh;   (80% of viewport)
                width: 100vw; height: 100vh; (Fullscreen)
            */
            width: 100vw;
            height: 100vh;
            border: 1px solid #222;
            /* Optional: adds a border to see the canvas edge */
        }
    </style>
</head>

<body>
    <canvas id="heartCanvas"></canvas>
    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        // Function to set canvas resolution based on its CSS size
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        // Global variables from various files
        const particles = [];
        const shatteredParticles = [];
        const particleCount = 1000; // Adjusted for performance
        let globalTime = 0;

        // Heart shape equation
        function heartShape(t) {
            // Scaling logic adapted from '123.html' to be based on canvas size
            let baseScale = Math.min(canvas.width, canvas.height) / 28;

            // Heartbeat effect from 'aixin0.1.html'
            const heartbeat = 0.8 + Math.sin(globalTime * 0.002) * 0.15;
            const scale = baseScale * heartbeat;

            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return {
                x: x * scale,
                y: y * scale
            };
        }

        // --- CLASSES from aixin0.1.html (for complex visuals) ---
        class Particle {
            constructor(t, offset = 0) {
                this.t = t;
                this.offset = offset;
                this.angle = Math.random() * Math.PI * 2;
                this.radius = Math.random() * 10 + 2;
                this.speed = Math.random() * 0.015 + 0.005;
                this.opacity = Math.random() * 0.6 + 0.3;
                this.baseOpacity = this.opacity;
                this.size = Math.random() * 2.5 + 0.5;
                this.z = (Math.random() - 0.5) * 200;
                this.rotationSpeed = (Math.random() - 0.5) * 0.015;
                this.life = 1;
                this.dying = false;
                this.colorPhase = Math.random() * Math.PI * 2;
                this.fallSpeed = 0;
                this.gravity = 0;
                this.shattered = false;
                this.update();
            }

            update() {
                if (this.dying) {
                    this.life -= 0.008;
                    this.fallSpeed += 0.3;
                    this.gravity += 0.15;
                    this.opacity = this.baseOpacity * this.life * this.life;
                    if (this.life <= 0) this.resurrect();
                } else {
                    if (Math.random() < 0.0003) {
                        this.dying = true;
                        this.shatter();
                    }
                }

                this.angle += this.rotationSpeed;
                const heartPos = heartShape(this.t + this.offset);
                const circleX = Math.cos(this.angle) * this.radius;
                const circleY = Math.sin(this.angle) * this.radius;
                const circleZ = Math.sin(this.angle * 2) * this.radius * 0.3;

                const perspective = 250;
                const scale = perspective / (perspective + this.z + circleZ);

                // Centering based on canvas.width/height
                this.x = canvas.width / 2 + (heartPos.x + circleX) * scale;
                this.y = canvas.height / 2 + (heartPos.y + circleY + this.fallSpeed) * scale;
                this.currentSize = this.size * scale;
                this.currentOpacity = this.opacity * scale;
                this.offset += this.speed * 0.1;
                this.colorPhase += 0.01;
            }

            resurrect() {
                this.life = 1;
                this.dying = false;
                this.fallSpeed = 0;
                this.gravity = 0;
                this.opacity = this.baseOpacity;
                this.radius = Math.random() * 12 + 3;
            }

            shatter() {
                if (!this.shattered) {
                    this.shattered = true;
                    for (let i = 0; i < 3; i++) {
                        shatteredParticles.push(new ShatteredFragment(this.x, this.y, this.currentSize));
                    }
                }
            }

            draw() {
                ctx.save();
                const hue = this.dying ? 250 : 220 + Math.sin(this.colorPhase) * 40;
                const saturation = this.dying ? 30 : 50 + Math.sin(this.colorPhase * 2) * 20;
                const lightness = this.dying ? 40 + this.life * 30 : 50 + Math.sin(this.colorPhase * 3) * 10;

                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.currentSize * 4);
                const goldTinge = Math.sin(globalTime * 0.001 + this.t) * 0.2 + 0.1;

                if (this.dying) {
                    gradient.addColorStop(0, `hsla(${hue}, ${saturation}%, ${lightness}%, ${this.currentOpacity})`);
                    gradient.addColorStop(1, `hsla(280, 40%, 20%, 0)`);
                } else {
                    gradient.addColorStop(0, `hsla(${hue}, ${saturation}%, ${lightness + 10}%, ${this.currentOpacity})`);
                    gradient.addColorStop(0.3, `hsla(45, 70%, 60%, ${goldTinge * this.currentOpacity})`);
                    gradient.addColorStop(1, `hsla(${hue + 30}, ${saturation - 20}%, ${lightness - 20}%, 0)`);
                }

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.currentSize * 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class ShatteredFragment {
            constructor(x, y, size) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = Math.random() * -5 - 2;
                this.size = size * (Math.random() * 0.5 + 0.3);
                this.life = 1;
                this.gravity = 0.3;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.life -= 0.015;
            }

            draw() {
                if (this.life <= 0) return false;
                ctx.save();
                const opacity = this.life * this.life;
                ctx.fillStyle = `hsla(280, 60%, ${40 + (1 - this.life) * 30}%, ${opacity})`;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
                return this.life > 0;
            }
        }

        // --- Initialization and Animation Loop ---
        function initParticles() {
            particles.length = 0;
            shatteredParticles.length = 0;
            const step = (Math.PI * 2) / particleCount;
            for (let i = 0; i < particleCount; i++) {
                const t = i * step;
                particles.push(new Particle(t, 0));
                if (i % 3 === 0) particles.push(new Particle(t, Math.PI / 4));
            }
        }

        function animate() {
            globalTime++;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => { p.update(); p.draw(); });
            shatteredParticles.forEach((p, index) => {
                p.update();
                if (!p.draw()) shatteredParticles.splice(index, 1);
            });

            requestAnimationFrame(animate);
        }

        // --- EVENT LISTENERS (Interactions) ---
        window.addEventListener('resize', () => {
            resizeCanvas();
            initParticles();
        });

        // Click interaction from 'aixin0.1.html'
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            for (let i = 0; i < 20; i++) {
                shatteredParticles.push(new ShatteredFragment(x, y, Math.random() * 5 + 2));
            }
            particles.forEach(p => {
                const dx = x - p.x;
                const dy = y - p.y;
                if (Math.sqrt(dx * dx + dy * dy) < 150) {
                    if (Math.random() < 0.3) p.dying = true;
                }
            });
        });

        // Mouse move interaction from 'aixin.html'
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            particles.forEach(particle => {
                const dx = mouseX - particle.x;
                const dy = mouseY - particle.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 100) {
                    const force = (100 - distance) / 100;
                    particle.x -= (dx / distance) * force * 2;
                    particle.y -= (dy / distance) * force * 2;
                }
            });
        });

        // --- Start animation ---
        resizeCanvas();
        initParticles();
        animate();
    </script>
</body>

</html>
